spring.application.name=microservicio-cuentas

server.port==${SERVER_PORT:9021}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

#Configuracion de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/cuentas
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:samy}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect


#Configuracion de la base de datos
spring.flyway.baseline-on-migrate=true
spring.flyway.migrate-at-start=true
spring.flyway.baseline-version=1.0.0
spring.flyway.locations=classpath:db/migration


spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}